<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOTILITONE WORK · 일동제약</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700;900&family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16241D;
    --ink-soft:#4A5C51;
    --bg:#F6F3EA;
    --surface:#FFFFFF;
    --primary:#1F4D3A;
    --primary-dark:#123326;
    --primary-light:#DCEEE3;
    --primary-tint:#EFF6F1;
    --accent:#C9A227;
    --accent-soft:#F5E9C8;
    --coral:#B94A3E;
    --coral-soft:#F6E2DF;
    --line:rgba(22,36,29,0.12);
    --line-soft:rgba(22,36,29,0.07);
    --shadow: 0 12px 30px -14px rgba(22,36,29,0.25);
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:9px;
    --font-display:'Noto Serif KR', serif;
    --font-body:'Noto Sans KR', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(31,77,58,0.06), transparent 40%),
      radial-gradient(circle at 88% 92%, rgba(201,162,39,0.07), transparent 45%);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #root{min-height:100vh; display:flex; flex-direction:column;}
  button{font-family:inherit; cursor:pointer;}
  input, select, textarea{font-family:inherit;}
  a{color:inherit;}
  .visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);}
  ::selection{background:var(--accent-soft);}

  /* ---------- shared bits ---------- */
  .wordmark{
    display:flex; align-items:center; gap:10px;
  }
  .pill-mark{
    width:34px; height:34px; border-radius:50%;
    background:linear-gradient(155deg, var(--primary), var(--primary-dark));
    display:flex; align-items:center; justify-content:center;
    position:relative; flex-shrink:0;
    box-shadow:0 4px 10px -4px rgba(18,51,38,0.6);
  }
  .pill-mark::after{
    content:"";
    width:14px; height:8px; border-radius:6px;
    background:linear-gradient(120deg, var(--accent-soft), var(--accent));
    transform:rotate(-38deg);
  }
  .wordmark-text{display:flex; flex-direction:column; line-height:1.05;}
  .wordmark-text b{font-family:var(--font-display); font-weight:700; font-size:15px; letter-spacing:0.5px;}
  .wordmark-text span{font-size:10px; color:var(--ink-soft); letter-spacing:0.5px;}

  .btn{
    border:none; border-radius:999px; padding:12px 20px; font-weight:600; font-size:14px;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--primary); color:#fff; box-shadow:0 10px 20px -10px rgba(18,51,38,0.7);}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-ghost{background:transparent; color:var(--primary); border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--primary);}
  .btn-accent{background:var(--accent); color:var(--primary-dark);}
  .btn-danger{background:var(--coral-soft); color:var(--coral);}
  .btn-sm{padding:8px 14px; font-size:12.5px;}
  .btn-block{width:100%;}
  .btn:disabled{opacity:0.45; cursor:not-allowed;}

  .field{margin-bottom:14px; text-align:left;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line);
    background:var(--surface); font-size:14.5px; color:var(--ink); outline:none;
    transition:border-color .15s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--primary);}
  .field textarea{resize:vertical; min-height:70px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .hint{font-size:12px; color:var(--ink-soft); background:var(--primary-tint); border-radius:10px; padding:10px 12px; margin:2px 0 18px; line-height:1.5;}
  .hint b{color:var(--primary);}
  .error-text{color:var(--coral); font-size:12.5px; margin:-6px 0 12px; font-weight:600;}

  .badge{display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:0.2px;}

  /* ---------- LOGIN ---------- */
  .login-screen{
    flex:1; display:flex; align-items:center; justify-content:center; padding:32px 18px;
  }
  .login-card{
    width:100%; max-width:380px; background:var(--surface); border-radius:var(--radius-lg);
    box-shadow:var(--shadow); padding:36px 30px 30px; text-align:center; border:1px solid var(--line-soft);
  }
  .login-mark{
    width:60px; height:60px; border-radius:50%; margin:0 auto 16px;
    background:linear-gradient(155deg, var(--primary), var(--primary-dark));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 12px 24px -10px rgba(18,51,38,0.7);
  }
  .login-mark::after{
    content:""; width:24px; height:13px; border-radius:10px;
    background:linear-gradient(120deg, var(--accent-soft), var(--accent));
    transform:rotate(-38deg);
  }
  .login-title{font-family:var(--font-display); font-size:22px; font-weight:700; margin:0 0 2px; letter-spacing:0.3px;}
  .login-sub{font-size:12.5px; color:var(--ink-soft); margin:0 0 26px;}
  .login-tab-toggle{
    display:flex; justify-content:center; gap:6px; margin-bottom:20px;
  }
  .login-form-title{font-size:14px; font-weight:700; margin:0 0 16px; color:var(--primary); text-align:left;}
  .login-switch{
    margin-top:18px; font-size:12.5px; color:var(--ink-soft); background:none; border:none; text-decoration:underline;
    text-underline-offset:3px; padding:4px;
  }
  .login-switch:hover{color:var(--primary);}

  /* ---------- APP SHELL (rep) ---------- */
  .app-shell{flex:1; display:flex; flex-direction:column; max-width:520px; margin:0 auto; width:100%; background:var(--bg); min-height:100vh; position:relative;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between; padding:16px 18px 14px;
    position:sticky; top:0; z-index:20; background:rgba(246,243,234,0.92); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line-soft);
  }
  .topbar-right{display:flex; align-items:center; gap:10px;}
  .icon-btn{
    width:34px; height:34px; border-radius:50%; border:1.5px solid var(--line); background:var(--surface);
    display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--ink-soft);
  }
  .points-chip{
    display:flex; align-items:center; gap:6px; background:var(--primary-dark); color:var(--accent-soft);
    padding:6px 12px 6px 8px; border-radius:999px; font-family:var(--font-mono); font-size:13px; font-weight:600;
  }
  .points-chip .pt-dot{width:16px; height:16px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-size:9px; color:var(--primary-dark);}

  .content-area{flex:1; padding:18px 18px 100px; overflow-y:auto;}
  .bottom-nav{
    position:sticky; bottom:0; z-index:20; display:flex; background:var(--surface);
    border-top:1px solid var(--line-soft); box-shadow:0 -8px 20px -16px rgba(22,36,29,0.4);
  }
  .nav-item{
    flex:1; border:none; background:none; padding:12px 4px 10px; display:flex; flex-direction:column; align-items:center; gap:4px;
    color:var(--ink-soft); font-size:11px; font-weight:600;
  }
  .nav-item .nav-ico{font-size:19px; opacity:0.55; transition:opacity .15s ease, transform .15s ease;}
  .nav-item.active{color:var(--primary);}
  .nav-item.active .nav-ico{opacity:1; transform:translateY(-1px);}

  /* section headers */
  .section-title{font-family:var(--font-display); font-size:19px; font-weight:700; margin:2px 0 4px;}
  .section-sub{font-size:12.5px; color:var(--ink-soft); margin:0 0 16px;}
  .eyebrow{font-size:11px; font-weight:700; letter-spacing:1.2px; color:var(--primary); text-transform:uppercase; margin:0 0 6px;}

  /* popup banner */
  .popup-banner{
    background:linear-gradient(120deg, var(--primary), var(--primary-dark)); color:#fff; border-radius:var(--radius-md);
    padding:16px 18px; margin-bottom:18px; position:relative; overflow:hidden;
  }
  .popup-banner::after{content:""; position:absolute; right:-30px; top:-30px; width:110px; height:110px; border-radius:50%; background:rgba(201,162,39,0.22);}
  .popup-banner .pb-tag{font-size:10.5px; font-weight:700; letter-spacing:0.6px; color:var(--accent-soft); margin-bottom:6px; text-transform:uppercase;}
  .popup-banner h4{margin:0 0 4px; font-size:15px; font-family:var(--font-display);}
  .popup-banner p{margin:0; font-size:12.5px; opacity:0.85; line-height:1.5;}
  .popup-close{position:absolute; top:10px; right:12px; background:rgba(255,255,255,0.16); border:none; color:#fff; width:22px; height:22px; border-radius:50%; font-size:12px;}

  /* gauge (signature element) */
  .gauge-card{
    background:var(--surface); border-radius:var(--radius-lg); padding:22px 20px 18px; margin-bottom:18px;
    border:1px solid var(--line-soft); box-shadow:var(--shadow);
  }
  .gauge-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px;}
  .gauge-points{font-family:var(--font-mono); font-size:30px; font-weight:600; color:var(--primary-dark); line-height:1;}
  .gauge-points span{font-size:13px; font-weight:500; color:var(--ink-soft); margin-left:4px;}
  .grade-badge{background:var(--accent-soft); color:#8a6d10; padding:5px 12px; border-radius:999px; font-size:12px; font-weight:700;}
  .pill-gauge{position:relative; height:22px; border-radius:999px; background:var(--primary-tint); border:1.5px solid var(--line-soft); overflow:hidden; margin:10px 0 8px;}
  .pill-gauge-fill{
    position:absolute; inset:0; width:0%; border-radius:999px;
    background:linear-gradient(90deg, var(--primary-light), var(--primary) 55%, var(--primary-dark));
    transition:width .6s cubic-bezier(.2,.8,.2,1);
  }
  .pill-gauge-fill::after{
    content:""; position:absolute; top:2px; left:6px; right:6px; height:5px; border-radius:999px; background:rgba(255,255,255,0.35);
  }
  .pill-gauge.sm{height:10px; margin:6px 0;}
  .gauge-ticks{display:flex; justify-content:space-between; font-size:10px; color:var(--ink-soft); font-family:var(--font-mono);}
  .gauge-next{font-size:12px; color:var(--ink-soft); margin-top:8px;}
  .gauge-next b{color:var(--primary);}

  /* stat row */
  .stat-row{display:flex; gap:10px; margin-bottom:18px;}
  .cat-tile-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin-bottom:20px;}
  .cat-tile{
    background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--radius-md); padding:14px 12px;
    text-align:left; display:flex; flex-direction:column; gap:6px; box-shadow:0 6px 16px -12px rgba(22,36,29,0.3);
  }
  .cat-tile-ico{font-size:18px;}
  .cat-tile-name{font-size:12.5px; font-weight:700; line-height:1.3; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .cat-tile-count{font-size:11px; color:var(--ink-soft); font-family:var(--font-mono);}
  .stat-box{flex:1; background:var(--surface); border-radius:var(--radius-md); padding:14px 12px; text-align:center; border:1px solid var(--line-soft);}
  .stat-box .num{font-family:var(--font-mono); font-size:19px; font-weight:600; color:var(--primary-dark);}
  .stat-box .lbl{font-size:11px; color:var(--ink-soft); margin-top:3px;}

  /* content list */
  .chip-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:16px; scrollbar-width:none;}
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0; padding:8px 15px; border-radius:999px; border:1.5px solid var(--line); background:var(--surface);
    font-size:12.5px; font-weight:600; color:var(--ink-soft); white-space:nowrap;
  }
  .chip.active{background:var(--primary); border-color:var(--primary); color:#fff;}
  .card-list{display:flex; flex-direction:column; gap:12px;}
  .content-card{
    background:var(--surface); border-radius:var(--radius-md); padding:16px; border:1px solid var(--line-soft);
    display:flex; gap:13px; align-items:flex-start; text-align:left; width:100%; box-shadow:0 6px 16px -12px rgba(22,36,29,0.3);
  }
  .content-ico{
    width:42px; height:42px; border-radius:12px; background:var(--primary-tint); display:flex; align-items:center; justify-content:center;
    font-size:18px; flex-shrink:0;
  }
  .content-card.done .content-ico{background:var(--accent-soft);}
  .content-body{flex:1; min-width:0;}
  .content-body .cat{font-size:10.5px; color:var(--primary); font-weight:700; letter-spacing:0.3px; margin-bottom:3px;}
  .content-body h5{margin:0 0 4px; font-size:14.5px; font-weight:700; line-height:1.35;}
  .content-body p{margin:0; font-size:12px; color:var(--ink-soft); line-height:1.5;}
  .content-meta{display:flex; align-items:center; gap:8px; margin-top:8px;}
  .pt-tag{font-family:var(--font-mono); font-size:11.5px; font-weight:700; color:var(--accent); background:var(--accent-soft); padding:2px 8px; border-radius:999px;}
  .done-tag{font-size:11px; font-weight:700; color:var(--primary);}
  .empty-state{text-align:center; padding:50px 20px; color:var(--ink-soft);}
  .empty-state .ico{font-size:34px; margin-bottom:10px;}

  /* ranking */
  .rank-row{
    display:flex; align-items:center; gap:12px; background:var(--surface); border-radius:var(--radius-md);
    padding:13px 15px; margin-bottom:10px; border:1px solid var(--line-soft);
  }
  .rank-row.me{border-color:var(--primary); background:var(--primary-tint);}
  .rank-num{width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; font-family:var(--font-mono); flex-shrink:0; background:var(--bg); color:var(--ink-soft);}
  .rank-num.top1{background:linear-gradient(155deg,#F4D06F,#C9A227); color:#5c4600;}
  .rank-num.top2{background:linear-gradient(155deg,#E4E4E4,#B7B7B7); color:#4a4a4a;}
  .rank-num.top3{background:linear-gradient(155deg,#E3B08A,#C08152); color:#5a3416;}
  .rank-info{flex:1; min-width:0;}
  .rank-info .nm{font-size:13.5px; font-weight:700;}
  .rank-info .dp{font-size:11px; color:var(--ink-soft);}
  .rank-pt{font-family:var(--font-mono); font-weight:700; font-size:14px; color:var(--primary-dark); text-align:right; flex-shrink:0;}

  /* modal / detail */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(22,36,29,0.5); display:flex; align-items:flex-end; justify-content:center;
    z-index:100; backdrop-filter:blur(2px);
  }
  .modal-overlay.center{align-items:center; padding:20px;}
  .modal-sheet{
    background:var(--surface); width:100%; max-width:520px; border-radius:22px 22px 0 0; padding:26px 22px 30px;
    max-height:88vh; overflow-y:auto; animation:slideUp .25s ease;
  }
  .modal-overlay.center .modal-sheet{border-radius:var(--radius-lg); max-height:85vh;}
  @keyframes slideUp{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal-handle{width:38px; height:4px; background:var(--line); border-radius:99px; margin:0 auto 18px;}
  .modal-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; gap:10px;}
  .modal-head h3{margin:0; font-family:var(--font-display); font-size:18px; line-height:1.4;}
  .modal-close{background:var(--bg); border:none; width:28px; height:28px; border-radius:50%; flex-shrink:0; color:var(--ink-soft); font-size:13px;}
  .modal-desc{font-size:13.5px; line-height:1.7; color:var(--ink-soft); margin-bottom:20px;}
  .modal-actions{display:flex; gap:10px; margin-top:6px;}

  .attach-section{margin-bottom:20px;}
  .attach-loading{font-size:12.5px; color:var(--ink-soft); padding:16px 0; text-align:center;}
  .attach-label{font-size:12px; font-weight:700; color:var(--primary); margin-bottom:10px;}
  .attach-img-block{border:1px solid var(--line-soft); border-radius:var(--radius-md); overflow:hidden; margin-bottom:10px; background:var(--bg);}
  .attach-img{width:100%; display:block; max-height:420px; object-fit:contain; background:#fff;}
  .attach-dl-link{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 14px; text-decoration:none; color:var(--ink);}
  .attach-item{
    display:flex; align-items:center; gap:10px; padding:12px 14px; border:1px solid var(--line-soft); border-radius:var(--radius-md);
    margin-bottom:10px; text-decoration:none; color:var(--ink); background:var(--surface);
  }
  .attach-ico{font-size:18px; flex-shrink:0;}
  .attach-fname{flex:1; font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .attach-dl-btn{flex-shrink:0; font-size:11.5px; font-weight:700; color:var(--primary); background:var(--primary-tint); padding:5px 10px; border-radius:999px; white-space:nowrap;}
  .attach-manager{border:1px solid var(--line-soft); border-radius:12px; padding:8px; background:var(--bg); margin-bottom:2px;}
  .attach-manage-row{display:flex; align-items:center; gap:8px; padding:7px 6px; border-bottom:1px solid var(--line-soft);}
  .attach-manage-row:last-child{border-bottom:none;}
  .attach-empty{font-size:12px; color:var(--ink-soft); padding:8px 4px;}
  .upload-status{font-size:11.5px; color:var(--primary); margin-top:6px; min-height:14px;}

  /* ---------- ADMIN ---------- */
  .admin-shell{flex:1; display:flex; flex-direction:column; min-height:100vh;}
  .admin-topbar{
    display:flex; align-items:center; justify-content:space-between; padding:16px 26px; background:var(--primary-dark);
    color:#fff; position:sticky; top:0; z-index:30;
  }
  .admin-topbar .wordmark-text b, .admin-topbar .wordmark-text span{color:#fff;}
  .admin-topbar .wordmark-text span{opacity:0.6;}
  .admin-top-actions{display:flex; align-items:center; gap:10px;}
  .admin-top-actions .btn-ghost{border-color:rgba(255,255,255,0.3); color:#fff;}
  .admin-tabs{
    display:flex; gap:2px; background:var(--surface); padding:0 20px; overflow-x:auto; border-bottom:1px solid var(--line-soft);
    position:sticky; top:60px; z-index:29; scrollbar-width:none;
  }
  .admin-tabs::-webkit-scrollbar{display:none;}
  .admin-tab{
    border:none; background:none; padding:14px 16px 12px; font-size:13.5px; font-weight:600; color:var(--ink-soft);
    white-space:nowrap; border-bottom:2.5px solid transparent; display:flex; align-items:center; gap:6px;
  }
  .admin-tab.active{color:var(--primary); border-color:var(--primary);}
  .admin-body{flex:1; padding:26px; max-width:1080px; margin:0 auto; width:100%;}
  .admin-head-row{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:18px; gap:12px; flex-wrap:wrap;}

  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:24px;}
  .kpi-card{background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--radius-md); padding:16px 18px; box-shadow:0 6px 16px -12px rgba(22,36,29,0.25);}
  .kpi-card .lbl{font-size:11.5px; color:var(--ink-soft); font-weight:600; margin-bottom:8px;}
  .kpi-card .val{font-family:var(--font-mono); font-size:24px; font-weight:600; color:var(--primary-dark);}
  .kpi-card .sub{font-size:11px; color:var(--accent); font-weight:700; margin-top:4px;}

  .panel{background:var(--surface); border-radius:var(--radius-md); border:1px solid var(--line-soft); overflow:hidden; margin-bottom:22px;}
  .panel-head{padding:16px 20px; border-bottom:1px solid var(--line-soft); display:flex; justify-content:space-between; align-items:center;}
  .panel-head h3{margin:0; font-size:15px; font-family:var(--font-display);}
  table.data-table{width:100%; border-collapse:collapse; font-size:13px;}
  table.data-table th{text-align:left; padding:10px 20px; font-size:11px; color:var(--ink-soft); font-weight:700; background:var(--bg); text-transform:uppercase; letter-spacing:0.3px;}
  table.data-table td{padding:12px 20px; border-top:1px solid var(--line-soft); vertical-align:middle;}
  table.data-table tr:hover td{background:var(--primary-tint);}
  .table-actions{display:flex; gap:6px;}
  .mini-btn{border:none; background:var(--bg); border-radius:8px; padding:6px 10px; font-size:11.5px; font-weight:600; color:var(--ink-soft);}
  .mini-btn:hover{background:var(--primary-light); color:var(--primary-dark);}

const CONTENT_TYPE_LABEL = {video:'영상', pdf:'PDF', card:'카드뉴스'};

/* ---- file / attachment helpers (item can be: string local asset | {name,url} uploaded/external) ---- */
function fileName(item){ return typeof item==='string' ? item : (item && item.name) || ''; }
function fileExt(item){ const n = fileName(item); const m = /\.([a-zA-Z0-9]+)$/.exec(n||''); return m ? m[1].toLowerCase() : ''; }
function isImageFile(item){ return ['png','jpg','jpeg','gif','webp'].includes(fileExt(item)); }
function fileIcon(item){
  const ext = fileExt(item);
  if(isImageFile(item)) return '🖼️';
  if(ext==='pptx' || ext==='ppt') return '📊';
  if(ext==='pdf') return '📄';
  return '📎';
}
function fileHref(item){
  if(typeof item==='string') return 'assets/' + encodeURI(item);
  if(item.url) return item.url;
  return '#';
}
function primaryIcon(c){
  if(c.files && c.files.length){
    if(c.files.some(f=>['pptx','ppt'].includes(fileExt(f)))) return '📊';
    if(c.files.some(f=>fileExt(f)==='pdf')) return '📄';
    return '🖼️';
  }
  return CONTENT_ICONS[c.type] || '📄';
}

/* ============================= APP STATE ============================= */
let DB = { employees:[], contents:[], popups:[], categories:[] };
let S = {
  screen:'login',            // login | rep | admin
  loginErr:'',
  currentUser:null,
  repTab:'home',
  contentFilter:'전체',
  adminTab:'overview',
  modal:null,                // {type,...}
  dismissedPopups:[],
  ready:false,
};

async function initDB(){
  const existingEmployees = await loadShared('employees', null);
  DB.employees  = existingEmployees ?? SEED_EMPLOYEES;
  DB.contents   = await loadShared('contents', null)   ?? SEED_CONTENTS;
  DB.popups     = await loadShared('popups', null)     ?? SEED_POPUPS;
  DB.categories = await loadShared('categories', null) ?? SEED_CATEGORIES;
  if(!existingEmployees) await persistAll(); // first run: seed the database
  S.ready = true;
  render();
}
async function persistAll(){
  await Promise.all([
    saveShared('employees', DB.employees),
    saveShared('contents', DB.contents),
    saveShared('popups', DB.popups),
    saveShared('categories', DB.categories),
  ]);
}
async function persist(key){
  const map = {employees:'employees', contents:'contents', popups:'popups', categories:'categories'};
  if(map[key]) await saveShared(map[key], DB[key]);
}

/* ============================= HELPERS ============================= */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function findEmployee(id){ return DB.employees.find(e=>e.id===id); }
function refreshCurrentUser(){ if(S.currentUser) S.currentUser = findEmployee(S.currentUser.id) || S.currentUser; }
function activePopups(){ return DB.popups.filter(p=>p.active && !S.dismissedPopups.includes(p.id)); }
function categories(){ return ['전체', ...DB.categories]; }
function fmtNum(n){ return Number(n||0).toLocaleString('ko-KR'); }

/* ============================= RENDER ROOT ============================= */
function render(){
  const root = document.getElementById('root');
  if(!S.ready){ root.innerHTML = `<div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:13px;">불러오는 중…</div>`; return; }
  if(S.screen==='login') root.innerHTML = renderLogin();
  else if(S.screen==='rep') root.innerHTML = renderRepShell();
  else if(S.screen==='admin') root.innerHTML = renderAdminShell();
  if(S.modal) root.innerHTML += renderModal();
  attachHandlers();
}

              <td style="color:var(--ink-soft); max-width:340px;">${esc(p.message)}</td>
              <td><button class="mini-btn" data-act="togglePopup" data-id="${p.id}"><span class="status-dot ${p.active?'on':'off'}">${p.active?'노출중':'숨김'}</span></button></td>
              <td><div class="table-actions">
                <button class="mini-btn" data-act="editPopup" data-id="${p.id}">수정</button>
                <button class="mini-btn danger" data-act="deletePopup" data-id="${p.id}">삭제</button>
              </div></td>
            </tr>`).join('')}
          ${!DB.popups.length ? `<tr><td colspan="4" style="text-align:center;color:var(--ink-soft);padding:24px;">등록된 팝업이 없습니다</td></tr>`:''}
        </tbody>
      </table>
    </div>
  `;
}

/* ============================= MODALS ============================= */
function renderModal(){
  const m = S.modal;
  if(!m) return '';
  if(m.type==='contentDetail') return modalContentDetail(m);
  if(m.type==='contentForm') return modalContentForm(m);
  if(m.type==='employeeForm') return modalEmployeeForm(m);
  if(m.type==='categoryForm') return modalCategoryForm(m);
  if(m.type==='popupForm') return modalPopupForm(m);
  return '';
}

function renderAttachImageRow(f){
  return '<div class="attach-img-block">'
    + '<img class="attach-img" src="' + fileHref(f) + '" alt="' + esc(fileName(f)) + '" loading="lazy" onerror="this.parentElement.style.display=\'none\'">'
    + '<a class="attach-dl-link" href="' + fileHref(f) + '" download="' + esc(fileName(f)) + '">'
    + '<span class="attach-fname">🖼️ ' + esc(fileName(f)) + '</span>'
    + '<span class="attach-dl-btn">다운로드 ⬇</span>'
    + '</a>'
    + '</div>';
}
function renderAttachDocRow(f){
  return '<a class="attach-item" href="' + fileHref(f) + '" download="' + esc(fileName(f)) + '">'
    + '<span class="attach-ico">' + fileIcon(f) + '</span>'
    + '<span class="attach-fname">' + esc(fileName(f)) + '</span>'
    + '<span class="attach-dl-btn">다운로드 ⬇</span>'
    + '</a>';
}
function renderAttachSection(c){
  const files = c.files || [];
  if(!files.length) return '';
  const images = files.filter(isImageFile);
  const docs = files.filter(f=>!isImageFile(f));
  let html = '<div class="attach-section"><div class="attach-label">📎 첨부 자료 ' + files.length + '개</div>';
  for(const f of images) html += renderAttachImageRow(f);
  for(const f of docs) html += renderAttachDocRow(f);
  html += '</div>';
  return html;
}

function modalContentDetail({id}){
  const c = DB.contents.find(x=>x.id===id);
  const attachHtml = renderAttachSection(c);
  return `
  <div class="modal-overlay" data-act="closeModal">
    <div class="modal-sheet" data-stop>
      <div class="modal-handle"></div>
      <div class="modal-head">
        <h3>${primaryIcon(c)} ${esc(c.title)}</h3>
        <button class="modal-close" data-act="closeModal">✕</button>
      </div>
      <div style="display:flex; gap:8px; margin-bottom:14px;">
        <span class="chip" style="padding:2px 10px;">${esc(c.category)}</span>
      </div>
      <p class="modal-desc">${esc(c.desc)}</p>
      ${attachHtml}
    </div>
  </div>`;
}

function renderAttachManageRow(f,i){
  return '<div class="attach-manage-row">'
    + '<span class="attach-ico">' + fileIcon(f) + '</span>'
    + '<span class="attach-fname">' + esc(fileName(f)) + '</span>'
    + '<button type="button" class="mini-btn danger" data-act="removeAttachment" data-index="' + i + '">삭제</button>'
    + '</div>';
}

function modalContentForm({data}){
  const isEdit = !!data.id;
  const draftFiles = data.files || [];
  const catOptions = DB.categories.includes(data.category) || !data.category
    ? DB.categories
    : [data.category, ...DB.categories]; // keep an orphaned category selectable
  const catOptionsHtml = catOptions.map(cat=>'<option value="' + esc(cat) + '" ' + (data.category===cat?'selected':'') + '>' + esc(cat) + '</option>').join('');
  const attachRowsHtml = draftFiles.length
    ? draftFiles.map((f,i)=>renderAttachManageRow(f,i)).join('')
    : '<div class="attach-empty">아직 첨부된 자료가 없습니다</div>';
  return `
  <div class="modal-overlay center" data-act="closeModal">
    <div class="modal-sheet" data-stop>
      <div class="modal-head"><h3>${isEdit?'콘텐츠 수정':'콘텐츠 등록'}</h3><button class="modal-close" data-act="closeModal">✕</button></div>
      <form id="dataForm" data-form="content" data-id="${data.id||''}">
        <div class="field"><label>제목</label><input name="title" value="${esc(data.title||'')}" required></div>
        <div class="field"><label>카테고리</label>
          <select name="category" required>
            ${catOptionsHtml}
          </select>
        </div>
        <div class="field"><label>설명</label><textarea name="desc" required>${esc(data.desc||'')}</textarea></div>
        <div class="field" style="display:flex;align-items:center;gap:8px;">
          <input type="checkbox" name="active" id="activeCk" ${data.active!==false?'checked':''} style="width:auto;">
          <label for="activeCk" style="margin:0;">운영중 상태로 노출</label>
        </div>

        <div class="field">
          <label>첨부 자료 (이미지 · PPT · PDF, 파일당 최대 20MB)</label>
          <div class="attach-manager">
            ${attachRowsHtml}
          </div>
          <input type="file" id="attachFileInput" accept="image/*,.pdf,.pptx,.ppt,.doc,.docx,.xls,.xlsx" multiple style="display:none;">
          <button type="button" class="btn btn-ghost btn-sm" style="margin-top:8px;" data-act="triggerFileUpload">📎 파일 추가</button>
          <div id="uploadStatus" class="upload-status"></div>
        </div>

        <div class="modal-actions">
          <button type="submit" class="btn btn-primary btn-block">${isEdit?'저장':'등록'}</button>
        </div>
      </form>
    </div>
  </div>`;
}

function modalCategoryForm({data}){
  const isEdit = !!data._orig;
  return `
  <div class="modal-overlay center" data-act="closeModal">
    <div class="modal-sheet" data-stop>
      <div class="modal-head"><h3>${isEdit?'카테고리 수정':'카테고리 추가'}</h3><button class="modal-close" data-act="closeModal">✕</button></div>
      <form id="dataForm" data-form="category" data-origname="${esc(data._orig||'')}">
        <div class="field"><label>카테고리명</label><input name="name" value="${esc(data.name||'')}" required></div>
        ${isEdit ? `<div class="hint">💡 이름을 바꾸면 이 카테고리를 쓰는 모든 콘텐츠에 자동 반영됩니다</div>` : ''}
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary btn-block">${isEdit?'저장':'추가'}</button>
        </div>
      </form>
    </div>
  </div>`;

function modalEmployeeForm({data}){
  const isEdit = !!data._orig;
  return `
  <div class="modal-overlay center" data-act="closeModal">
    <div class="modal-sheet" data-stop>
      <div class="modal-head"><h3>${isEdit?'계정 정보 수정':'계정 등록'}</h3><button class="modal-close" data-act="closeModal">✕</button></div>
      <form id="dataForm" data-form="employee" data-origid="${data._orig||''}">
        <div class="field"><label>아이디 (로그인 ID)</label><input name="id" value="${esc(data.id||'')}" ${isEdit?'readonly style="background:var(--bg);color:var(--ink-soft);"':''} required></div>
        <div class="field"><label>이름</label><input name="name" value="${esc(data.name||'')}" required></div>
        <div class="field-row">
          <div class="field"><label>소속</label><input name="dept" value="${esc(data.dept||'')}" required></div>
          <div class="field"><label>지역</label><input name="region" value="${esc(data.region||'')}" required></div>
        </div>
        ${!isEdit ? `<div class="hint">💡 비밀번호는 아이디와 동일하게 자동 설정됩니다</div>` : ''}

function modalPopupForm({data}){
  const isEdit = !!data.id;
  return `
  <div class="modal-overlay center" data-act="closeModal">
    <div class="modal-sheet" data-stop>
      <div class="modal-head"><h3>${isEdit?'팝업 수정':'팝업 등록'}</h3><button class="modal-close" data-act="closeModal">✕</button></div>
      <form id="dataForm" data-form="popup" data-id="${data.id||''}">
        <div class="field"><label>제목</label><input name="title" value="${esc(data.title||'')}" required></div>
        <div class="field"><label>내용</label><textarea name="message" required>${esc(data.message||'')}</textarea></div>
        <div class="field" style="display:flex;align-items:center;gap:8px;">
          <input type="checkbox" name="active" id="popActive" ${data.active!==false?'checked':''} style="width:auto;">
          <label for="popActive" style="margin:0;">즉시 노출</label>
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary btn-block">${isEdit?'저장':'등록'}</button>
        </div>
      </form>
    </div>
  </div>`;

/* ============================= EVENT HANDLING ============================= */
function attachHandlers(){
  const root = document.getElementById('root');

  // stop propagation inside sheets
  root.querySelectorAll('[data-stop]').forEach(el=>el.addEventListener('click', e=>e.stopPropagation()));

  root.addEventListener('submit', onSubmit);
  root.addEventListener('click', onClick);
  root.addEventListener('change', onChange);
}

function syncContentFormDraft(){
  const form = document.getElementById('dataForm');
  if(!form || form.dataset.form!=='content' || !S.modal || !S.modal.data) return;
  const fd = new FormData(form);
  S.modal.data.title = fd.get('title');
  S.modal.data.category = fd.get('category');
  S.modal.data.desc = fd.get('desc');
  S.modal.data.active = fd.get('active')==='on';
}

async function onChange(e){
  const input = e.target;
  if(input.id==='attachFileInput'){
    const files = Array.from(input.files || []);
    if(!files.length) return;
    syncContentFormDraft();
    const statusEl = document.getElementById('uploadStatus');
    for(const file of files){
      if(file.size > MAX_UPLOAD_BYTES){
        alert(`'${file.name}' 파일이 너무 큽니다 (${(file.size/1024/1024).toFixed(1)}MB). 파일당 최대 20MB까지 업로드할 수 있어요.`);
        continue;
      }
      if(statusEl) statusEl.textContent = `${file.name} 업로드 중…`;
      try{
        const url = await uploadAttachment(file);
        if(!S.modal.data.files) S.modal.data.files = [];
        S.modal.data.files.push({name:file.name, url});
      }catch(err){
        console.error('upload failed', err);
        alert(`'${file.name}' 업로드에 실패했습니다: ${(err && err.message) || err}`);
      }
    }
    if(statusEl) statusEl.textContent = '';
    render();
  }
}

async function onSubmit(e){
  const form = e.target;
  if(form.id==='loginForm'){ e.preventDefault(); return handleLogin(form); }
  if(form.id==='dataForm'){ e.preventDefault(); return handleDataForm(form); }
}

async function handleLogin(form){
  const uid = form.uid.value.trim();
  const pw = form.pw.value.trim();
  if(uid.toLowerCase()==='admin' && pw.toLowerCase()==='admin'){
    S.screen='admin'; S.adminTab='overview'; S.loginErr='';
    render();
    return;
  }
  const emp = DB.employees.find(x=>x.id.toLowerCase()===uid.toLowerCase());
  if(emp && pw.toLowerCase()===emp.id.toLowerCase()){
    S.currentUser = emp; S.screen='rep'; S.repTab='home'; S.loginErr=''; S.dismissedPopups=[];
  }else{
    S.loginErr = '아이디 또는 비밀번호가 일치하지 않습니다.';
  }
  render();
}

async function handleDataForm(form){
  const type = form.dataset.form;
  const fd = new FormData(form);
  if(type==='content'){
    const id = form.dataset.id;
    const payload = {
      title: fd.get('title').trim(), category: fd.get('category').trim(),
      desc: fd.get('desc').trim(), active: fd.get('active')==='on',
      files: (S.modal && S.modal.data && S.modal.data.files) || []
    };
    if(id){ Object.assign(DB.contents.find(c=>c.id===id), payload); }
    else { DB.contents.push({id:'C'+Date.now(), ...payload}); }
    await persist('contents');
  }
  if(type==='category'){
    const origName = form.dataset.origname;
    const name = fd.get('name').trim();
    if(origName){
      const idx = DB.categories.indexOf(origName);
      if(idx>-1) DB.categories[idx] = name;
      DB.contents.forEach(c=>{ if(c.category===origName) c.category = name; });
      await persist('contents');
    } else if(!DB.categories.includes(name)) {
      DB.categories.push(name);
    }
    await persist('categories');
  }
  if(type==='employee'){
    const origId = form.dataset.origid;
    const id = fd.get('id').trim();
    const payload = {name:fd.get('name').trim(), dept:fd.get('dept').trim(), region:fd.get('region').trim()};
    if(origId){ Object.assign(findEmployee(origId), payload); }
    else { DB.employees.push({id, ...payload}); }
    await persist('employees');
  }
  if(type==='popup'){
    const id = form.dataset.id;
    const payload = {title:fd.get('title').trim(), message:fd.get('message').trim(), active:fd.get('active')==='on'};
    if(id){ Object.assign(DB.popups.find(p=>p.id===id), payload); }
    else { DB.popups.push({id:'P'+Date.now(), ...payload}); }
    await persist('popups');
  }
  S.modal = null;
  render();
}

async function onClick(e){
  const t = e.target.closest('[data-act]');
  if(!t){
    if(e.target.closest('.modal-overlay') && !e.target.closest('[data-stop]')){ S.modal=null; render(); }
    return;
  }
  const act = t.dataset.act;

  if(act==='logout'){ S.screen='login'; S.currentUser=null; S.loginErr=''; render(); return; }
  if(act==='closeModal'){ S.modal=null; render(); return; }

  // rep nav
  if(act==='repTab'){ S.repTab = t.dataset.tab; render(); return; }
  if(act==='filterContent'){
    S.contentFilter = t.dataset.cat;
    if(t.dataset.tab) S.repTab = t.dataset.tab;
    render();
    return;
  }
  if(act==='dismissPopup'){ S.dismissedPopups.push(t.dataset.id); render(); return; }
  if(act==='openContent'){ S.modal = {type:'contentDetail', id:t.dataset.id}; render(); return; }

  // admin nav
  if(act==='adminTab'){ S.adminTab = t.dataset.tab; render(); return; }
  if(act==='refreshAdmin'){ await initReload(); return; }

  // content CRUD
  if(act==='newContent'){ S.modal={type:'contentForm', data:{active:true, category:DB.categories[0]||'', files:[]}}; render(); return; }
  if(act==='editContent'){ const c = DB.contents.find(x=>x.id===t.dataset.id); S.modal={type:'contentForm', data:{...c, files:[...(c.files||[])]}}; render(); return; }
  if(act==='deleteContent'){
    if(confirm('이 콘텐츠를 삭제할까요?')){
      DB.contents = DB.contents.filter(c=>c.id!==t.dataset.id);
      await persist('contents');
      render();
    }
    return;
  }

  // category CRUD
  if(act==='newCategory'){ S.modal={type:'categoryForm', data:{}}; render(); return; }
  if(act==='editCategory'){ S.modal={type:'categoryForm', data:{name:t.dataset.name, _orig:t.dataset.name}}; render(); return; }
  if(act==='deleteCategory'){
    const name = t.dataset.name;
    const inUse = DB.contents.filter(c=>c.category===name).length;
    if(inUse>0){ alert(`'${name}' 카테고리를 사용중인 콘텐츠가 ${inUse}개 있어 삭제할 수 없습니다. 먼저 해당 콘텐츠의 카테고리를 변경해주세요.`); return; }
    if(confirm(`'${name}' 카테고리를 삭제할까요?`)){ DB.categories = DB.categories.filter(c=>c!==name); await persist('categories'); render(); }
    return;
  }

  // attachment management (inside content form modal)
  if(act==='triggerFileUpload'){ const input = document.getElementById('attachFileInput'); if(input) input.click(); return; }
  if(act==='removeAttachment'){
    syncContentFormDraft();
    const idx = parseInt(t.dataset.index,10);
    S.modal.data.files.splice(idx,1);
    render();
    return;
  }

  // employee CRUD
  if(act==='newEmployee'){ S.modal={type:'employeeForm', data:{}}; render(); return; }
  if(act==='editEmployee'){ const emp = findEmployee(t.dataset.id); S.modal={type:'employeeForm', data:{...emp, _orig:emp.id}}; render(); return; }
  if(act==='deleteEmployee'){ if(confirm('이 계정을 삭제할까요?')){ DB.employees = DB.employees.filter(e=>e.id!==t.dataset.id); await persist('employees'); render(); } return; }

  // popups
  if(act==='newPopup'){ S.modal={type:'popupForm', data:{active:true}}; render(); return; }
  if(act==='editPopup'){ const p = DB.popups.find(x=>x.id===t.dataset.id); S.modal={type:'popupForm', data:{...p}}; render(); return; }
  if(act==='deletePopup'){ if(confirm('이 팝업을 삭제할까요?')){ DB.popups = DB.popups.filter(p=>p.id!==t.dataset.id); await persist('popups'); render(); } return; }
  if(act==='togglePopup'){ const p = DB.popups.find(x=>x.id===t.dataset.id); p.active=!p.active; await persist('popups'); render(); return; }
}

async function initReload(){
  S.ready=false; render();
  await initDB();
}

/* ============================= BOOT ============================= */
initDB().catch(err=>{
  console.error('init failed, falling back to seed data', err);
  DB.employees = SEED_EMPLOYEES; DB.contents = SEED_CONTENTS; DB.popups = SEED_POPUPS;
  DB.categories = SEED_CATEGORIES;
  S.ready = true; render();
});
</script>
</body>
